<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自媒體陪跑學習單</title>
<style>
:root{--bg:#faf8fc;--card:#ffffff;--ink:#2b2833;--muted:#6a6577;--line:#e3deec;--accent:#6a55c9}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16141b;--card:#201d28;--ink:#ece9f2;--muted:#a8a3b5;--line:#37323f;--accent:#a898f2;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16141b;--card:#201d28;--ink:#ece9f2;--muted:#a8a3b5;--line:#37323f;--accent:#a898f2;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding-block:48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:1.6rem;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
a.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;color:var(--ink);text-decoration:none;margin-bottom:12px}
a.item:hover,a.item:focus-visible{border-color:var(--accent);outline:none}
a.item strong{display:block}
a.item span{color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>自媒體陪跑學習單</h1>
<p>三個月自媒體陪跑的每週學習單。你填的內容只存在你自己的瀏覽器，不會上傳。</p>
<a class="item" href="lesson1/">
<strong>第 1 堂課學習單</strong>
<span>起點、市場觀察與定位</span>
</a>
<a class="item" href="lesson2/">
<strong>第 2 堂課學習單</strong>
<span>受眾與修正定位</span>
</a>
</main>
</body>
</html>
